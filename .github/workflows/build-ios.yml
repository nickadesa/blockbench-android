name: Package iOS Web Bundle & Project

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-ios:
    name: Package iOS Deliverable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Web Assets to iOS Bundle
        run: |
          mkdir -p ios/BlockbenchModMobile/BlockbenchModMobile/assets
          cp -r app/src/main/assets/* ios/BlockbenchModMobile/BlockbenchModMobile/assets/
          ls -la ios/BlockbenchModMobile/BlockbenchModMobile/assets/

      - name: Archive iOS Package
        run: |
          mkdir -p build-output
          zip -r build-output/BlockbenchModMobile-iOS-Source.zip ios/
          ls -la build-output/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-ios-package
          path: build-output/BlockbenchModMobile-iOS-Source.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.2.0' }}
          files: build-output/BlockbenchModMobile-iOS-Source.zip
