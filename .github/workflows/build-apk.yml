name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Deliverable
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/blockbenchmod.apk
          cp app/build/outputs/apk/release/app-release.apk build-output/blockbench-android.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbenchmod-apk
          path: build-output/blockbenchmod.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.2.2' }}
          name: Blockbench Mod Mobile ${{ github.ref_name || 'v1.2.2' }}
          draft: false
          prerelease: false
          files: |
            build-output/blockbenchmod.apk
            build-output/blockbench-android.apk
          body: |
            Blockbench Mod Mobile (${{ github.ref_name || 'v1.2.2' }})

            Key Features & Capabilities:
            1. 100% Standalone Offline 3D Modeling:
               - Complete low-poly 3D modeling editor, Three.js engine, shaders, and textures bundled on-device.
               - Zero internet connection required.
            2. Synchronized 120Hz Hardware Display Engine:
               - Android WindowManager display mode synchronization for smooth 3D viewport navigation.
               - Configurable frame rate targets (60, 90, 120 FPS, Uncapped) and on-screen FPS monitor.
            3. Floating Touch Controller & Working Modifier Keys:
               - Fixed-position floating buttons (LMB, RMB, MMB / 3D Pan, Space, Undo, Redo, Del).
               - Solid bright green (#2ecc71) indicators with [ON] badges for CTRL, SHIFT, and ALT modifiers.
               - Deep event capture integration for outliner multi-selection, uniform scaling, and precision snapping.
            4. Layout Customization:
               - Edit Button Layout mode allows dragging buttons anywhere on screen with permanent local persistence.
               - Built-in ergonomic presets (Split Hands, Dock Right, Dock Left, Reset Defaults).
            5. Clean Header & Consolidated Settings:
               - Single compact 32px gear button docked at the top right, guaranteeing zero overlap with native Blockbench buttons.
               - In-modal controls for Immersive Fullscreen, FPS overlay, haptics, and UI scaling (75% to 130%).

            License & Legal Notice:
            - Mod extensions and native wrapper licensed under the MIT License.
            - Upstream Blockbench components remain under GPL-3.0.
            - Independent open-source project by DAVINICK. Not affiliated with, endorsed by, or sponsored by Jannis Brinkmann, Blockbench, Mojang AB, or Microsoft Corporation.
            - Software provided AS IS without warranty of any kind.
