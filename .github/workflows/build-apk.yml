name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Deliverable
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/blockbench-android.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-android-apk
          path: build-output/blockbench-android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Blockbench Mod Mobile ${{ github.ref_name || 'v1.2.1' }}
          draft: false
          prerelease: false
          files: build-output/blockbench-android.apk
          body: |
            Blockbench Mod Mobile (${{ github.ref_name || 'v1.2.1' }})

            Key Updates in v1.2.1:
            1. Solid Green Modifier Indicators:
               - CTRL, SHIFT, and ALT buttons now turn vivid solid green (#2ecc71) with a distinct [ON] badge when activated.
               - Deep event hooking ensures modifiers work seamlessly with Blockbench OrbitControls, TransformControls, pan, rotation, and multi-selection.
            2. Live API Detection and Model Population:
               - Pasting an API key automatically queries the provider API (Google Gemini, Groq Cloud, Cloudflare Workers AI, OpenRouter, FreeLLMAPI).
               - Model selection is populated dynamically from live API endpoints without relying on outdated static model lists.
               - Automatic recommendation selection (e.g. gemini-2.0-flash, llama-3.3-70b-versatile).
               - Visual status badge reports connection health and count of live loaded models.
            3. In-Chat Reference Image Submissions:
               - Multi-image attachments (up to 5 images) uploaded directly and rendered inline in the chat bubble alongside user prompts.
            4. Layout Persistence:
               - Floating controller buttons remain locked in normal usage, with dedicated Edit Layout mode for repositioning.
            5. Branding & High Refresh Rate:
               - Official app title: Blockbench Mod Mobile.
               - Custom launcher icons and 120Hz display refresh rate synchronization.
