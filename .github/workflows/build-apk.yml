name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Deliverable
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/blockbench-android.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-android-apk
          path: build-output/blockbench-android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Blockbench Mod Mobile ${{ github.ref_name || 'v1.2.2' }}
          draft: false
          prerelease: false
          files: build-output/blockbench-android.apk
          body: |
            Blockbench Mod Mobile (${{ github.ref_name || 'v1.2.2' }})

            Key Updates in v1.2.2:
            1. Complete AI Subsystem Removal:
               - Removed AI Assistant drawer, provider connectors, commands, tools, and background scripts completely as requested.
            2. Clean Header UI with Zero Button Interference:
               - Top-right header streamlined to a single compact Mobile Settings gear button.
               - Header docking ensures Blockbench native buttons (Mode Switcher, Menu, Search, Undo, Redo) are never blocked or displaced.
            3. Consolidated Mobile Settings:
               - Immersive Fullscreen, Realtime FPS Display, Target Refresh Rate (60/90/120/Uncapped), Button Layout Editor, Layout Presets, Haptic Feedback, and UI Scaling accessible from a single clean modal.
            4. Touch Controller & Solid Green Modifier Keys:
               - Floating controller buttons locked in place during modeling.
               - Solid bright green (#2ecc71) indicators with [ON] badges for CTRL, SHIFT, and ALT modifiers.
